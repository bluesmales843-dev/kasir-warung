$('v').innerHTML=`<div class="card"><div class="row"><select id="rg" onchange="rg=this.value;V.laporan()" style="width:auto;margin:0">${[['today','Hari ini'],['week','7 hari'],['month','Bulan ini'],['year','Tahun ini'],['cus','Pilih tanggal']].map(o=>`<option value="${o[0]}" ${rg==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${rg=='cus'?`<input type="date" value="${rf}" onchange="rf=this.value;V.laporan()" style="width:auto;margin:0"><input type="date" value="${rt}" onchange="rt=this.value;V.laporan()" style="width:auto;margin:0">`:''}<button class="g" onclick="dl('laporan.csv',window._rep)">Unduh Excel/CSV</button><button class="g" onclick="prt(document.getElementById('rp').innerHTML)">Cetak / PDF</button></div></div><div id="rp"><div class="card"><div class="stats"><div>Omzet<b>${rp(om)}</b></div><div>Laba kotor<b>${rp(lb)}</b></div><div>Transaksi<b>${S.length}</b></div><div>Pengeluaran<b>${rp(E)}</b></div><div>Laba bersih<b>${rp(lb-E)}</b></div></div></div><div class="card"><h3>Grafik penjualan</h3><div class="tw">${chart}</div></div><div class="grid f"><div class="card"><h3>Terlaris</h3>${pr.slice(0,8).map(p=>`<div class="it"><div>${esc(p[0])}</div><b>${p[1]}</b></div>`).join('')||'-'}</div><div class="card"><h3>Kurang laku</h3>${db.prods.map(p=>[p.name,pq[p.name]||0]).sort((x,y)=>x[1]-y[1]).slice(0,8).map(p=>`<div class="it"><div>${esc(p[0])}</div><b>${p[1]}</b></div>`).join('')||'-'}</div></div><div class="card"><h3>Metode pembayaran</h3>${Object.entries(pm).map(p=>`<div class="it"><div>${p[0]}</div><b>${rp(p[1])}</b></div>`).join('')||'-'}</div><div class="card"><h3>Stok (nilai modal ${rp(db.prods.reduce((x,p)=>x+p.stock*p.buy,0))})</h3><div class="tw"><table>${db.prods.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td></tr>`).join('')}</table></div></div></div><div class="card"><h3>Riwayat transaksi</h3>${S.map(s=>`<div class="it"><div onclick="receipt(${s.id})" style="cursor:pointer">${s.no}<br><small>${fd(s.t)} · ${esc(s.cashier)}</small></div><b>${rp(s.total)}</b>${can('void')?`<button class="r s" onclick="vd(${s.id})">Batal</button>`:''}</div>`).join('')||'<p class="m">Tidak ada.</p>'}</div>`};
function vd(id){const s=db.sales.find(x=>x.id==id);if(!confirm('Batalkan transaksi '+s.no+'? Stok dikembalikan.'))return;s.void=1;s.items.forEach(i=>{const p=find(i.id);if(p){const b=i.qty*(i.m||1);p.stock=Math.round((p.stock+b)*1000)/1000;db.slog.unshift({t:Date.now(),pid:p.id,q:b,type:'Batal',note:s.no})}});lg('Batal '+s.no);save();V.laporan()}

/* PENGATURAN */
V.atur=()=>{const s=db.set;$('v').innerHTML=`<div class="card"><h3>Identitas & tampilan</h3><div class="row"><button onclick="sid()">Ubah identitas warung</button><button class="g" onclick="fm('Logo',[{k:'i',l:'Pilih logo',t:'file'}],r=>{if(r.i){db.set.logo=r.i;save();shell()}})">Logo</button><button class="g" onclick="fm('QRIS',[{k:'i',l:'Gambar QRIS warung',t:'file',max:600}],r=>{if(r.i){db.set.qris=r.i;save();alert('QRIS disimpan')}})">Gambar QRIS</button><button class="g" onclick="fm('Tampilan',[{k:'color',l:'Warna',t:'color',v:db.set.color},{k:'theme',l:'Tema',t:'sel',o:[['auto','Otomatis'],['light','Terang'],['dark','Gelap']],v:db.set.theme}],r=>{Object.assign(db.set,r);save();shell()})">Warna & tema</button></div></div>
<div class="card"><h3>Struk</h3><div class="row"><button class="g" onclick="fm('Struk',[{k:'paper',l:'Ukuran kertas',t:'sel',o:[['58','58 mm'],['80','80 mm'],['A4','A4']],v:db.set.paper},{k:'footer',l:'Pesan penutup',v:db.set.footer}],r=>{Object.assign(db.set,r);save();V.atur()})">Ukuran: ${s.paper} · ubah</button></div></div>
<div class="card"><h3>Kategori</h3>${db.cats.map((c,i)=>`<div class="it"><div>${esc(c)}</div><button class="g s" onclick="fm('Nama kategori',[{k:'n',l:'Nama',v:db.cats[${i}]}],r=>{if(!r.n)return false;db.prods.forEach(p=>{if(p.cat==db.cats[${i}])p.cat=r.n});db.cats[${i}]=r.n;save();V.atur()})">✎</button><button class="r s" onclick="if(confirm('Hapus kategori?')){db.cats.splice(${i},1);save();V.atur()}">✕</button></div>`).join('')}<button onclick="fm('Kategori baru',[{k:'n',l:'Nama'}],r=>{if(r.n){db.cats.push(r.n);save();V.atur()}})" style="margin-top:8px">+ Kategori</button></div>
<div class="card"><h3>Pengguna</h3>${db.users.map(u=>`<div class="it"><div>${esc(u.name)} <small>(${u.role})</small></div><button class="g s" onclick="uf(${u.id})">Ubah / ganti PIN</button><button class="g s" onclick="pm(${u.id})">Izin</button>${u.id!=me.id?`<button class="r s" onclick="if(confirm('Hapus pengguna?')){db.users=db.users.filter(x=>x.id!=${u.id});save();V.atur()}">✕</button>`:''}</div>`).join('')}<button onclick="uf()" style="margin-top:8px">+ Pengguna</button><p class="m" style="font-size:12px">Pemilik: semua akses. Untuk tiap pengguna lain, tombol Izin mengatur menu dan fitur (ubah harga, diskon, batalkan transaksi) yang boleh dipakai.</p></div>
<div class="card"><h3>Backup data</h3><div class="row"><button onclick="db.lastBackup=Date.now();save();dl('backup-kasir-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db),'application/json')">Backup (unduh)</button><button class="g" onclick="rs()">Restore</button><button class="r" onclick="if(confirm('HAPUS SEMUA DATA?')&&prompt('Ketik HAPUS')=='HAPUS'){db=D0();save();location.reload()}">Reset</button></div><p class="m" style="font-size:12px">Data tersimpan di browser perangkat ini. Backup rutin, dan pindahkan ke perangkat lain lewat Restore.</p></div>
<div class="card"><h3>Riwayat aktivitas</h3>${db.log.slice(0,30).map(l=>`<div class="it"><div>${esc(l.a)}<br><small>${fd(l.t)} · ${esc(l.u)}</small></div></div>`).join('')}</div>`};
function sid(){const s=db.set;fm('Identitas warung',[{k:'name',l:'Nama usaha',v:s.name},{k:'owner',l:'Nama pemilik',v:s.owner},{k:'addr',l:'Alamat',v:s.addr},{k:'wa',l:'Nomor WhatsApp',v:s.wa}],r=>{Object.assign(db.set,r);save();shell()})}
function uf(id){const u=db.users.find(x=>x.id==id)||{};fm('Pengguna',[{k:'name',l:'Nama',v:u.name},{k:'role',l:'Peran',t:'sel',o:['owner','kasir'],v:u.role||'kasir'},{k:'pin',l:'PIN / password',v:u.pin}],r=>{if(!r.name||!r.pin)return false;if(u.id){if(u.id==me.id&&r.role!='owner'){alert('Tidak bisa menurunkan peran sendiri');return false}Object.assign(u,r)}else db.users.push({id:uid(),...r});lg('Ubah pengguna '+r.name);save();V.atur()})}
function rs(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.prods||!d.users)throw 0;if(!confirm('Timpa semua data dengan backup ini?'))return;db=d;save();alert('Restore berhasil. Silakan masuk lagi.');me=null;login()}catch(e){alert('File backup tidak valid')}};i.click()}
let ip=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;const b=$("ib");if(b)b.style.display="block"});
login();
if(ip&&$("ib"))$("ib").style.display="block";
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
