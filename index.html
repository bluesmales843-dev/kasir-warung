<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kasir Warung Sembako</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--p:#0f766e;--bg:#f3f6f5;--c:#fff;--t:#1b2421;--m:#66726e;--b:#dce3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111615;--c:#1b2220;--t:#e8eeec;--m:#97a5a0;--b:#2c3633}}
:root[data-theme=dark]{--bg:#111615;--c:#1b2220;--t:#e8eeec;--m:#97a5a0;--b:#2c3633}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}button.g{background:transparent;color:var(--t);border:1px solid var(--b)}button.r{background:#c0392b}button.s{padding:5px 9px;font-size:13px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;margin:3px 0 9px}
label{display:block;font-size:13px;color:var(--m)}h3{margin:0 0 10px}
header{background:var(--p);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}header img{height:30px;border-radius:6px}header b{flex:1}header button{background:#fff3;padding:6px 10px}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:46px;z-index:4}nav button{background:none;color:var(--m);border-radius:0;white-space:nowrap}nav button.on{color:var(--p);border-bottom:3px solid var(--p);font-weight:600}
main{padding:12px;max-width:1100px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:800px){.k{grid-template-columns:1.2fr 1fr}.f{grid-template-columns:1fr 1fr}}
.stats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.stats div{background:var(--bg);border-radius:10px;padding:10px}.stats b{display:block;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.sp{flex:1!important}
.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}.it>div{flex:1;min-width:0}.it small,.m{color:var(--m)}.it img,.ph{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--bg)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:16px}#m>div{background:var(--c);border-radius:14px;padding:16px;width:100%;max-width:460px}
.bad{color:#c0392b}.ok{color:#1a8a4a}.big{font-size:22px;font-weight:700}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block!important;color:#000;background:#fff}}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="rc"></div><style id="pg"></style>
<script>
const K='kasir_warung_db_v1',$=id=>document.getElementById(id);
const D0=()=>({set:{name:'Warung Sembako',owner:'',addr:'',wa:'',color:'#0f766e',theme:'auto',logo:'',qris:'',bank:'',paper:'58',footer:'Terima kasih sudah berbelanja!'},
users:[{id:1,name:'Pemilik',role:'owner',pin:'1234'},{id:2,name:'Kasir 1',role:'kasir',pin:'0000'}],
cats:['Sembako','Makanan','Minuman','Rumah Tangga','Lainnya'],prods:[],sales:[],custs:[],pays:[],exps:[],slog:[],log:[],seq:1});
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||D0();
let me=null,view='kasir',cart=[],disc=0,rg='today',rf='',rt='',tmo=0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Penyimpanan penuh. Ganti foto/logo dengan yang lebih kecil atau backup lalu hapus data lama.')}};
const uid=()=>db.seq++,rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID'),fd=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lg=a=>{db.log.unshift({t:Date.now(),u:me?me.name:'-',a});db.log.length=Math.min(db.log.length,200)};
const own=()=>me&&me.role=='owner';
function theme(){const r=document.documentElement;r.style.setProperty('--p',db.set.color);db.set.theme=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',db.set.theme);document.title=db.set.name}
function rd(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)})}
function modal(h){$('m').innerHTML='<div>'+h+'</div>';$('m').style.display='flex'}
function cl(){if(window.stopCam)stopCam();$('m').style.display='none'}
function fm(title,fs,ok){modal(`<h3>${title}</h3>`+fs.map(f=>`<label>${f.l}${f.t=='sel'?`<select id="f_${f.k}">${f.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${v==f.v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`:f.t=='file'?`<input id="f_${f.k}" type="file" accept="image/*">`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.t=='number'?'inputmode="decimal"':''}>`}</label>`).join('')+'<div class="row"><button class="g" onclick="cl()">Batal</button><button id="ok">Simpan</button></div>');
$('ok').onclick=async()=>{const r={};for(const f of fs){const e=$('f_'+f.k);r[f.k]=f.t=='file'?(e.files[0]?await rd(e.files[0],f.max||240):null):f.t=='number'?(+e.value||0):e.value.trim()}if(ok(r)!==false)cl()}}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty||'text/csv'}));a.download=n;a.click()}
const csv=rows=>'\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');

/* LOGIN */
function login(){theme();$('app').innerHTML=`<main style="max-width:360px;margin-top:8vh"><div class="card" style="text-align:center">${db.set.logo?`<img src="${db.set.logo}" style="height:64px;border-radius:12px">`:''}<h2>${esc(db.set.name)}</h2><label style="text-align:left">Pengguna<select id="lu">${db.users.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select></label><label style="text-align:left">PIN / Password<input id="lp" type="password" inputmode="numeric" onkeydown="if(event.key=='Enter')go()"></label><button onclick="go()" style="width:100%">Masuk</button><p class="m" style="font-size:12px">Awal: Pemilik PIN 1234, Kasir 1 PIN 0000. Segera ganti di Pengaturan.</p></div></main>`}
function go(){const u=db.users.find(u=>u.id==$('lu').value);if(u&&u.pin==$('lp').value){me=u;view='kasir';lg('Login');save();shell()}else alert('PIN salah')}
const PL=[['kasir','Menu Kasir'],['produk','Menu Produk'],['stok','Menu Stok'],['pelanggan','Menu Pelanggan'],['keuangan','Menu Keuangan'],['laporan','Menu Laporan'],['price','Ubah harga di kasir'],['disc','Beri diskon'],['void','Batalkan transaksi']],DEFP=['kasir','pelanggan','disc'];
const can=k=>me&&(me.role=='owner'||(me.perm||DEFP).includes(k));
function pm(id){const u=db.users.find(x=>x.id==id),p=u.perm||DEFP;modal(`<h3>Izin: ${esc(u.name)}</h3>${PL.map(x=>`<label style="color:var(--t)"><input type="checkbox" class="pk" value="${x[0]}" ${p.includes(x[0])?'checked':''} style="width:auto;margin-right:8px">${x[1]}</label>`).join('')}<div class="row"><button class="g" onclick="cl()">Batal</button><button onclick="db.users.find(x=>x.id==${id}).perm=[...document.querySelectorAll('.pk:checked')].map(e=>e.value);save();cl();V.atur()">Simpan</button></div><p class="m" style="font-size:12px">Pemilik selalu punya semua izin.</p>`)}
const TABS=[['kasir','Kasir',1],['produk','Produk',0],['stok','Stok',0],['pelanggan','Pelanggan',1],['keuangan','Keuangan',0],['laporan','Laporan',0],['atur','Pengaturan',0]];
function shell(){theme();$('app').innerHTML=`<header>${db.set.logo?`<img src="${db.set.logo}">`:''}<b>${esc(db.set.name)}</b><span>${esc(me.name)}</span><button onclick="me=null;cart=[];login()">Keluar</button></header><nav>${TABS.filter(t=>can(t[0])).map(t=>`<button class="${view==t[0]?'on':''}" onclick="view='${t[0]}';shell()">${t[1]}</button>`).join('')}</nav><main id="v"></main>`;V[view]()}

/* KASIR */
const find=id=>db.prods.find(p=>p.id==id);
const sub=()=>cart.reduce((s,c)=>s+c.qty*c.price-(c.d||0),0);
V={};
V.kasir=()=>{$('v').innerHTML=`<div class="grid k"><div class="card"><div class="row"><input id="q" class="sp" placeholder="Cari nama / ketik atau scan kode lalu Enter" oninput="res()" onkeydown="if(event.key=='Enter')qEnter()" style="margin:0"><button onclick="cam()">📷 Scan</button></div><div id="res"></div></div><div class="card" id="cart"></div></div>`;res();drawCart();setTimeout(()=>$('q')&&$('q').focus(),50)};
function res(){const q=($('q').value||'').toLowerCase(),l=db.prods.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q)).slice(0,30);
$('res').innerHTML=l.length?l.map(p=>`<div class="it" onclick="add(${p.id})" style="cursor:pointer">${p.img?`<img src="${p.img}">`:'<div class="ph"></div>'}<div><b>${esc(p.name)}</b><br><small>${esc(p.cat)} · stok ${p.stock}</small></div><b>${rp(p.sell)}</b></div>`).join(''):`<p class="m">${db.prods.length?'Produk tidak ditemukan.':'Belum ada produk. Tambahkan di menu Produk (pemilik).'}</p>`}
function qEnter(){const v=$('q').value.trim();if(!v)return;const p=db.prods.find(p=>p.code&&p.code==v);if(p){add(p.id);$('q').value='';res()}else{const l=db.prods.filter(p=>p.name.toLowerCase().includes(v.toLowerCase()));if(l.length==1){add(l[0].id);$('q').value='';res()}else if(!l.length)unk(v)}}
function unk(c){if(can('produk')&&confirm('Kode "'+c+'" belum terdaftar. Tambah produk baru?'))pf({code:c});else if(!can('produk'))alert('Kode belum terdaftar. Hubungi pemilik.')}
function add(id){const p=find(id),c=cart.find(c=>c.id==id),n=(c?c.qty:0)+1;if(n>p.stock){alert('Stok '+p.name+' tidak cukup (sisa '+p.stock+')');return}c?c.qty=n:cart.push({id,qty:1,price:p.sell});drawCart()}
function drawCart(){const t=sub(),tot=Math.max(0,t-disc);$('cart').innerHTML=`<h3>Keranjang</h3>${cart.length?cart.map((c,i)=>`<div class="it"><div><b>${esc(find(c.id).name)}</b><br><small onclick="${can('price')?`pr(${i})`:''}">${rp(c.price)}${can('price')?' ✎':''}</small> · <small onclick="idc(${i})" style="cursor:pointer;color:var(--p)">${c.d?'diskon -'+rp(c.d):'+ diskon'}</small></div><button class="g s" onclick="qty(${i},-1)">−</button><b>${c.qty}</b><button class="g s" onclick="qty(${i},1)">+</button><button class="r s" onclick="cart.splice(${i},1);drawCart()">✕</button></div>`).join(''):'<p class="m">Keranjang kosong.</p>'}<div class="row" style="margin-top:8px"><span class="sp">Subtotal</span><b>${rp(t)}</b></div><div class="row"><span class="sp">Diskon <button class="g s" onclick="dsc()">ubah</button></span><b>-${rp(disc)}</b></div><div class="row"><span class="sp big">Total</span><span class="big">${rp(tot)}</span></div><div class="row" style="margin-top:10px"><button class="g" onclick="if(cart.length&&confirm('Batalkan transaksi ini?')){cart=[];disc=0;drawCart()}">Batalkan</button><button class="sp" ${cart.length?'':'disabled'} onclick="pay()">Bayar</button></div>`}
function qty(i,d){const c=cart[i],n=c.qty+d;if(n<1)return cart.splice(i,1),drawCart();if(n>find(c.id).stock){alert('Stok tidak cukup');return}c.qty=n;drawCart()}
function pr(i){const v=prompt('Harga satuan baru',cart[i].price);if(v!==null&&+v>=0){cart[i].price=+v;drawCart()}}
function idc(i){if(!can('disc'))return alert('Tidak punya izin memberi diskon');const v=prompt('Diskon barang ini (Rp untuk seluruh baris, atau persen mis. 10%)',cart[i].d||0);if(v===null)return;const g=cart[i].qty*cart[i].price;cart[i].d=Math.min(g,/%$/.test(v)?Math.round(g*parseFloat(v)/100)||0:+v||0);drawCart()}
function dsc(){if(!can('disc'))return alert('Tidak punya izin memberi diskon');const v=prompt('Diskon total (Rp), atau tulis persen mis. 10%',disc);if(v===null)return;disc=/%$/.test(v)?Math.round(sub()*parseFloat(v)/100)||0:+v||0;drawCart()}
function pay(){const tot=Math.max(0,sub()-disc);modal(`<h3>Pembayaran ${rp(tot)}</h3><div class="row"><label class="sp">Tunai<input id="p1" type="number" inputmode="numeric" oninput="pc()"></label><label class="sp">QRIS<input id="p2" type="number" inputmode="numeric" oninput="pc()"></label><label class="sp">Transfer<input id="p3" type="number" inputmode="numeric" oninput="pc()"></label></div><button class="g s" onclick="$('p1').value=${tot};pc()">Uang pas (tunai)</button><div id="pcc" class="big" style="margin:8px 0"></div>${db.set.qris?`<details><summary>Tampilkan QRIS</summary><img src="${db.set.qris}" style="max-width:100%"></details><p class="m" style="font-size:12px">Cek sendiri dana QRIS/transfer sudah masuk sebelum mengisi jumlahnya.</p>`:''}<label>Pelanggan (wajib bila bon)<select id="pcu"><option value="">Umum</option>${db.custs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>No. referensi<input id="pref"></label><label>Catatan<input id="pnote"></label><div class="row"><button class="g" onclick="cl()">Kembali</button><button class="sp" onclick="done()">Simpan transaksi</button></div>`);pc()}
const pv=()=>[1,2,3].map(i=>+$('p'+i).value||0);
function pc(){const tot=Math.max(0,sub()-disc),s=pv().reduce((a,b)=>a+b,0);$('pcc').innerHTML=s>=tot?`Kembalian: <span class="ok">${rp(s-tot)}</span>`:`Kurang / bon: <span class="bad">${rp(tot-s)}</span>`}
function done(){const tot=Math.max(0,sub()-disc),[a,b,c]=pv(),s=a+b+c,cu=+$('pcu').value||0,ch=Math.max(0,s-tot);
if(s<tot&&!cu){alert('Pembayaran kurang. Pilih pelanggan untuk mencatat sebagai utang/bon.');return}
if(ch>a){alert('Kembalian hanya bisa dari uang tunai.');return}
const sale={id:uid(),t:Date.now(),items:cart.map(c=>{const p=find(c.id);return{id:p.id,name:p.name,qty:c.qty,price:c.price,d:c.d||0,buy:p.buy}}),disc,total:tot,pay:[['Tunai',a-ch],['QRIS',b],['Transfer',c]].filter(x=>x[1]>0),paid:Math.min(s,tot),debt:Math.max(0,tot-s),cust:cu,cashier:me.name,ref:$('pref').value,note:$('pnote').value};
sale.no='TRX'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(sale.id).padStart(4,'0');
sale.items.forEach(i=>{const p=find(i.id);p.stock-=i.qty;db.slog.unshift({t:sale.t,pid:p.id,q:-i.qty,type:'Jual',note:sale.no})});
db.sales.unshift(sale);lg('Transaksi '+sale.no+' '+rp(tot));save();cart=[];disc=0;cl();drawCart();receipt(sale.id)}
function receipt(id){const s=db.sales.find(x=>x.id==id),st=db.set,cu=db.custs.find(c=>c.id==s.cust),w=st.paper=='A4'?'190mm':st.paper+'mm',fs=st.paper=='58'?'11px':'13px';
const h=`<div style="width:${w};font:${fs}/1.35 monospace;margin:auto;padding:4px"><div style="text-align:center">${st.logo?`<img src="${st.logo}" style="height:40px"><br>`:''}<b>${esc(st.name)}</b><br>${esc(st.addr)}<br>${st.wa?'WA '+esc(st.wa):''}</div><hr>${s.no}<br>${fd(s.t)}<br>Kasir: ${esc(s.cashier)}${cu?'<br>Pelanggan: '+esc(cu.name):''}<hr>${s.items.map(i=>`${esc(i.name)}<br>&nbsp;${i.qty} x ${rp(i.price)}<span style="float:right">${rp(i.qty*i.price)}</span>${i.d?`<br>&nbsp;diskon<span style="float:right">-${rp(i.d)}</span>`:''}`).join('<br>')}<hr>${s.disc?`Diskon<span style="float:right">-${rp(s.disc)}</span><br>`:''}<b>TOTAL<span style="float:right">${rp(s.total)}</span></b><br>${s.pay.map(p=>`${p[0]}<span style="float:right">${rp(p[1])}</span>`).join('<br>')}${s.debt?`<br><b>Sisa utang<span style="float:right">${rp(s.debt)}</span></b>`:''}${s.paid<s.total||s.pay.length?'':''}<br>${s.ref?'Ref: '+esc(s.ref)+'<br>':''}<hr><div style="text-align:center">${esc(st.footer)}</div></div>`;
window._rh=h;const wa=cu&&cu.wa?'https://wa.me/'+cu.wa.replace(/\D/g,'').replace(/^0/,'62')+'?text='+encodeURIComponent(`${st.name}\n${s.no}\n${s.items.map(i=>i.qty+'x '+i.name+' '+rp(i.qty*i.price)).join('\n')}\nTotal ${rp(s.total)}${s.debt?'\nSisa utang '+rp(s.debt):''}\n${st.footer}`):'';
modal(`<div style="overflow:auto">${h}</div><div class="row" style="margin-top:10px"><button class="g" onclick="cl()">Tutup</button><button onclick="prt(window._rh)">Cetak</button>${wa?`<button onclick="window.open('${wa}')">WhatsApp</button>`:''}</div><p class="m" style="font-size:12px">Cetak: pilih printer thermal (Bluetooth/USB) di dialog cetak, atau "Simpan sebagai PDF".</p>`)}
function prt(h){$('pg').textContent='@page{margin:'+(db.set.paper=='A4'?'12mm':'0')+';size:'+(db.set.paper=='A4'?'A4':db.set.paper+'mm auto')+'}';$('rc').innerHTML=h;window.print()}
let cs=null;function stopCam(){if(cs){cs.getTracks().forEach(t=>t.stop());cs=null}}
async function cam(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices){alert('Browser ini belum mendukung scan kamera. Pakai Chrome Android terbaru, atau scanner USB/Bluetooth (ketik di kolom cari).');return}
modal('<h3>Arahkan ke barcode</h3><video id="vd" playsinline muted style="width:100%;border-radius:10px"></video><button class="g" onclick="cl()" style="margin-top:8px">Tutup</button>');
try{cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('vd');v.srcObject=cs;await v.play();const d=new BarcodeDetector();const tick=async()=>{if(!cs)return;try{const r=await d.detect(v);if(r.length){const c=r[0].rawValue;cl();const p=db.prods.find(p=>p.code==c);p?add(p.id):unk(c);return}}catch(e){}setTimeout(tick,300)};tick()}catch(e){cl();alert('Kamera tidak bisa dibuka (izin ditolak?).')}}

/* PRODUK */
V.produk=()=>{$('v').innerHTML=`<div class="card"><div class="row"><input id="pq" class="sp" placeholder="Cari nama/kode" oninput="pl()" style="margin:0"><button onclick="pf()">+ Produk</button><button class="g" onclick="pex()">Export</button><button class="g" onclick="pim()">Import</button></div><p class="m" style="font-size:12px">Import CSV: nama,kategori,kode,modal,jual,stok (tanpa judul kolom).</p><div class="tw" id="pls"></div></div>`;pl()};
function pl(){const q=$('pq').value.toLowerCase();$('pls').innerHTML=`<table><tr><th>Produk</th><th>Modal</th><th>Jual</th><th>Stok</th><th></th></tr>${db.prods.filter(p=>p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q)).map(p=>`<tr><td>${p.img?`<img src="${p.img}" style="width:28px;height:28px;border-radius:6px;vertical-align:middle"> `:''}<b>${esc(p.name)}</b><br><small class="m">${esc(p.cat)} ${p.code?'· '+esc(p.code):''}</small></td><td>${rp(p.buy)}</td><td>${rp(p.sell)}</td><td class="${p.stock<=p.min?'bad':''}">${p.stock}${p.stock<=p.min?' ⚠':''}</td><td><button class="g s" onclick="pf(find(${p.id}))">Edit</button> <button class="g s" onclick="lb(${p.id})">Label</button> <button class="r s" onclick="pdel(${p.id})">Hapus</button></td></tr>`).join('')}</table>`}
function pf(p){p=p||{};const n=!p.id;fm(n?'Produk baru':'Edit produk',[{k:'name',l:'Nama',v:p.name},{k:'cat',l:'Kategori',t:'sel',o:db.cats,v:p.cat},{k:'code',l:'Barcode / kode (boleh kosong)',v:p.code},{k:'buy',l:'Harga modal',t:'number',v:p.buy},{k:'sell',l:'Harga jual',t:'number',v:p.sell},{k:'stock',l:'Stok',t:'number',v:p.stock},{k:'min',l:'Batas stok menipis',t:'number',v:p.min??5},{k:'img',l:'Foto (opsional)',t:'file',max:160}],r=>{if(!r.name){alert('Nama wajib');return false}if(r.code&&db.prods.some(x=>x.code==r.code&&x.id!=p.id)){alert('Kode sudah dipakai produk lain');return false}
if(n){db.prods.push({id:uid(),...r,img:r.img||''});lg('Tambah produk '+r.name)}else{if(p.sell!=r.sell||p.buy!=r.buy)db.slog.unshift({t:Date.now(),pid:p.id,q:0,type:'Harga',note:`modal ${p.buy}→${r.buy}, jual ${p.sell}→${r.sell}`});if(p.stock!=r.stock)db.slog.unshift({t:Date.now(),pid:p.id,q:r.stock-p.stock,type:'Edit stok',note:''});const im=r.img||p.img;Object.assign(p,r,{img:im});lg('Edit produk '+r.name)}save();view=='kasir'?res():V.produk()})}
function pdel(id){if(confirm('Hapus produk ini?')){db.prods=db.prods.filter(p=>p.id!=id);lg('Hapus produk');save();pl()}}
function pex(){dl('produk.csv',csv([['nama','kategori','kode','modal','jual','stok'],...db.prods.map(p=>[p.name,p.cat,p.code,p.buy,p.sell,p.stock])]))}
function pim(){const i=document.createElement('input');i.type='file';i.accept='.csv,.txt';i.onchange=async()=>{const rows=(await i.files[0].text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());let n=0;rows.forEach(l=>{const c=l.split(/[,;]/).map(x=>x.replace(/^"|"$/g,'').trim());if(!c[0]||isNaN(+c[4]))return;const cat=c[1]||'Lainnya';if(!db.cats.includes(cat))db.cats.push(cat);let p=c[2]&&db.prods.find(x=>x.code==c[2]);p?Object.assign(p,{name:c[0],cat,buy:+c[3]||0,sell:+c[4],stock:+c[5]||0}):db.prods.push({id:uid(),name:c[0],cat,code:c[2]||'',buy:+c[3]||0,sell:+c[4],stock:+c[5]||0,min:5,img:''});n++});lg('Import '+n+' produk');save();alert(n+' produk diimpor');pl()};i.click()}

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function bc(t){t=[...t].filter(c=>c.charCodeAt(0)>=32&&c.charCodeAt(0)<127).join('');let s=104;const v=[104];[...t].forEach((c,i)=>{const n=c.charCodeAt(0)-32;v.push(n);s+=(i+1)*n});v.push(s%103,106);let x=10,r='';v.forEach(n=>{[...C128[n]].forEach((w,i)=>{if(i%2==0)r+=`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=+w})});return`<svg viewBox="0 0 ${x+10} 52" style="width:100%;height:auto" shape-rendering="crispEdges"><g fill="#000">${r}</g><text x="${(x+20)/2}" y="50" font-size="9" text-anchor="middle" font-family="monospace">${esc(t)}</text></svg>`}
function lb(id){const p=find(id);fm('Label barcode: '+p.name,[{k:'n',l:'Jumlah label',t:'number',v:12}],r=>{if(!p.code){p.code='P'+String(p.id).padStart(5,'0');save()}const one=`<div style="border:1px dashed #999;padding:4px;width:42mm;text-align:center;font:10px sans-serif;break-inside:avoid"><b>${esc(p.name)}</b><br>${rp(p.sell)}${bc(p.code)}</div>`;setTimeout(pl,200);prt(`<div style="display:flex;flex-wrap:wrap;gap:2mm">${one.repeat(Math.min(200,Math.max(1,r.n)))}</div>`)})}
/* STOK */
V.stok=()=>{const low=db.prods.filter(p=>p.stock<=p.min);$('v').innerHTML=`<div class="card"><div class="row"><button onclick="sf('Masuk')">+ Stok masuk / beli</button><button class="g" onclick="sf('Rusak/Kedaluwarsa')">Barang rusak/kedaluwarsa</button><button class="g" onclick="sf('Opname')">Stok opname</button></div></div><div class="card"><h3>Stok menipis (${low.length})</h3>${low.map(p=>`<div class="it"><div>${esc(p.name)}</div><b class="bad">${p.stock}</b></div>`).join('')||'<p class="m">Aman.</p>'}</div><div class="card"><h3>Riwayat stok & harga</h3><div class="tw"><table>${db.slog.slice(0,60).map(l=>{const p=find(l.pid);return`<tr><td>${fd(l.t)}</td><td>${esc(p?p.name:'(dihapus)')}</td><td>${esc(l.type)} ${l.q||''}</td><td class="m">${esc(l.note)}</td></tr>`}).join('')}</table></div></div>`};
function sf(t){if(!db.prods.length)return alert('Tambahkan produk dulu');const o=db.prods.map(p=>[p.id,p.name+' (stok '+p.stock+')']);fm('Stok: '+t,[{k:'p',l:'Produk',t:'sel',o},{k:'q',l:t=='Opname'?'Stok sebenarnya (hasil hitung)':'Jumlah',t:'number'},...(t=='Masuk'?[{k:'b',l:'Harga beli satuan (kosong = tidak diubah)',t:'number'},{k:'s',l:'Supplier'}]:[{k:'s',l:'Catatan'}])],r=>{const p=find(r.p);let q=r.q;if(t=='Masuk'){if(q<=0)return false;p.stock+=q;if(r.b)p.buy=r.b;db.slog.unshift({t:Date.now(),pid:p.id,q,type:'Masuk',note:(r.s?'Supplier '+r.s+' ':'')+(r.b?'@'+r.b:'')})}else if(t=='Opname'){db.slog.unshift({t:Date.now(),pid:p.id,q:q-p.stock,type:'Opname',note:'dari '+p.stock+' → '+q+' '+r.s});p.stock=q}else{if(q<=0||q>p.stock){alert('Jumlah tidak valid');return false}p.stock-=q;db.slog.unshift({t:Date.now(),pid:p.id,q:-q,type:'Rusak/Exp',note:r.s})}lg('Stok '+t+' '+p.name);save();V.stok()})}

/* PELANGGAN */
const bal=id=>db.sales.filter(s=>s.cust==id&&!s.void).reduce((a,s)=>a+s.debt,0)-db.pays.filter(p=>p.cust==id).reduce((a,p)=>a+p.a,0);
V.pelanggan=()=>{$('v').innerHTML=`<div class="card"><button onclick="cf()">+ Pelanggan</button><p class="m">Total piutang: <b>${rp(db.custs.reduce((a,c)=>a+bal(c.id),0))}</b></p>${db.custs.map(c=>{const b=bal(c.id);return`<div class="it"><div><b>${esc(c.name)}</b><br><small>${esc(c.wa)}</small></div><b class="${b>0?'bad':''}">${rp(b)}</b><button class="s g" onclick="ch(${c.id})">Riwayat</button><button class="s" onclick="cp(${c.id})">Bayar</button><button class="s g" onclick="cf(db.custs.find(x=>x.id==${c.id}))">✎</button></div>`}).join('')||'<p class="m">Belum ada pelanggan.</p>'}</div>`};
function cf(c){c=c||{};fm('Pelanggan',[{k:'name',l:'Nama',v:c.name},{k:'wa',l:'Nomor WhatsApp',v:c.wa}],r=>{if(!r.name)return false;c.id?Object.assign(c,r):db.custs.push({id:uid(),...r});save();V.pelanggan()})}
function cp(id){fm('Bayar cicilan (sisa '+rp(bal(id))+')',[{k:'a',l:'Jumlah dibayar',t:'number'}],r=>{if(r.a<=0||r.a>bal(id)){alert('Jumlah tidak valid');return false}db.pays.unshift({id:uid(),cust:id,a:r.a,t:Date.now()});lg('Cicilan utang '+rp(r.a));save();V.pelanggan()})}
function ch(id){modal(`<h3>Riwayat</h3>${db.sales.filter(s=>s.cust==id).map(s=>`<div class="it" onclick="receipt(${s.id})"><div>${s.no}<br><small>${fd(s.t)}${s.void?' · BATAL':''}</small></div><b>${rp(s.total)}</b></div>`).join('')}${db.pays.filter(p=>p.cust==id).map(p=>`<div class="it"><div>Cicilan<br><small>${fd(p.t)}</small></div><b class="ok">${rp(p.a)}</b></div>`).join('')}<button class="g" onclick="cl()">Tutup</button>`)}

/* KEUANGAN */
const salesPaid=()=>db.sales.filter(s=>!s.void).reduce((a,s)=>a+s.paid,0);
V.keuangan=()=>{const inn=db.exps.filter(e=>e.k=='in').reduce((a,e)=>a+e.a,0),out=db.exps.filter(e=>e.k=='out').reduce((a,e)=>a+e.a,0),cic=db.pays.reduce((a,p)=>a+p.a,0);
$('v').innerHTML=`<div class="card"><div class="stats"><div>Saldo kas<b>${rp(inn+salesPaid()+cic-out)}</b></div><div>Penjualan diterima<b>${rp(salesPaid())}</b></div><div>Cicilan utang<b>${rp(cic)}</b></div><div>Pengeluaran<b>${rp(out)}</b></div></div><div class="row" style="margin-top:10px"><button onclick="ef('in')">+ Modal / pemasukan</button><button class="r" onclick="ef('out')">+ Pengeluaran</button></div></div><div class="card"><h3>Riwayat kas manual</h3>${db.exps.map(e=>`<div class="it"><div>${esc(e.cat)}<br><small>${fd(e.t)} ${esc(e.d)}</small></div><b class="${e.k=='in'?'ok':'bad'}">${e.k=='in'?'+':'-'}${rp(e.a)}</b><button class="g s" onclick="if(confirm('Hapus catatan?')){db.exps=db.exps.filter(x=>x.id!=${e.id});save();V.keuangan()}">✕</button></div>`).join('')||'<p class="m">Belum ada.</p>'}</div>`};
function ef(k){fm(k=='in'?'Pemasukan':'Pengeluaran',[{k:'cat',l:'Jenis',t:'sel',o:k=='in'?['Modal usaha','Pemasukan lain']:['Biaya operasional','Pembelian stok','Lainnya']},{k:'a',l:'Jumlah',t:'number'},{k:'d',l:'Keterangan'}],r=>{if(r.a<=0)return false;db.exps.unshift({id:uid(),k,t:Date.now(),...r});lg('Kas '+r.cat+' '+rp(r.a));save();V.keuangan()})}

/* LAPORAN */
function range(){const n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate());let a=s,b=new Date(+s+864e5);if(rg=='week')a=new Date(+s-6*864e5);if(rg=='month')a=new Date(n.getFullYear(),n.getMonth(),1);if(rg=='year')a=new Date(n.getFullYear(),0,1);if(rg=='cus'&&rf&&rt){a=new Date(rf+'T00:00');b=new Date(+new Date(rt+'T00:00')+864e5)}return[+a,+b]}
V.laporan=()=>{const[a,b]=range(),S=db.sales.filter(s=>!s.void&&s.t>=a&&s.t<b),om=S.reduce((x,s)=>x+s.total,0),lb=S.reduce((x,s)=>x+s.items.reduce((y,i)=>y+(i.price-i.buy)*i.qty-(i.d||0),0)-s.disc,0),E=db.exps.filter(e=>e.k=='out'&&e.t>=a&&e.t<b).reduce((x,e)=>x+e.a,0);
const pm={};S.forEach(s=>s.pay.forEach(p=>pm[p[0]]=(pm[p[0]]||0)+p[1]));const pq={};S.forEach(s=>s.items.forEach(i=>pq[i.name]=(pq[i.name]||0)+i.qty));
const pr=Object.entries(pq).sort((x,y)=>y[1]-x[1]),mo=(b-a)>62*864e5,g={};S.forEach(s=>{const k=new Date(s.t).toISOString().slice(0,mo?7:10);g[k]=(g[k]||0)+s.total});const ks=Object.keys(g).sort(),mx=Math.max(1,...Object.values(g));
const chart=ks.length?`<svg viewBox="0 0 ${Math.max(300,ks.length*34)} 130" style="width:100%;max-width:${Math.max(300,ks.length*34)}px">${ks.map((k,i)=>`<rect x="${i*34+4}" y="${105-g[k]/mx*95}" width="26" height="${g[k]/mx*95}" fill="var(--p)" rx="3"/><text x="${i*34+17}" y="122" font-size="8" text-anchor="middle" fill="currentColor">${k.slice(mo?5:8)}</text>`).join('')}</svg>`:'<p class="m">Belum ada data.</p>';
window._rep=csv([['No','Waktu','Kasir','Total','Diskon','Dibayar','Utang'],...S.map(s=>[s.no,fd(s.t),s.cashier,s.total,s.disc,s.paid,s.debt])]);
$('v').innerHTML=`<div class="card"><div class="row"><select id="rg" onchange="rg=this.value;V.laporan()" style="width:auto;margin:0">${[['today','Hari ini'],['week','7 hari'],['month','Bulan ini'],['year','Tahun ini'],['cus','Pilih tanggal']].map(o=>`<option value="${o[0]}" ${rg==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${rg=='cus'?`<input type="date" value="${rf}" onchange="rf=this.value;V.laporan()" style="width:auto;margin:0"><input type="date" value="${rt}" onchange="rt=this.value;V.laporan()" style="width:auto;margin:0">`:''}<button class="g" onclick="dl('laporan.csv',window._rep)">Unduh Excel/CSV</button><button class="g" onclick="prt(document.getElementById('rp').innerHTML)">Cetak / PDF</button></div></div><div id="rp"><div class="card"><div class="stats"><div>Omzet<b>${rp(om)}</b></div><div>Laba kotor<b>${rp(lb)}</b></div><div>Transaksi<b>${S.length}</b></div><div>Pengeluaran<b>${rp(E)}</b></div><div>Laba bersih<b>${rp(lb-E)}</b></div></div></div><div class="card"><h3>Grafik penjualan</h3><div class="tw">${chart}</div></div><div class="grid f"><div class="card"><h3>Terlaris</h3>${pr.slice(0,8).map(p=>`<div class="it"><div>${esc(p[0])}</div><b>${p[1]}</b></div>`).join('')||'-'}</div><div class="card"><h3>Kurang laku</h3>${db.prods.map(p=>[p.name,pq[p.name]||0]).sort((x,y)=>x[1]-y[1]).slice(0,8).map(p=>`<div class="it"><div>${esc(p[0])}</div><b>${p[1]}</b></div>`).join('')||'-'}</div></div><div class="card"><h3>Metode pembayaran</h3>${Object.entries(pm).map(p=>`<div class="it"><div>${p[0]}</div><b>${rp(p[1])}</b></div>`).join('')||'-'}</div><div class="card"><h3>Stok (nilai modal ${rp(db.prods.reduce((x,p)=>x+p.stock*p.buy,0))})</h3><div class="tw"><table>${db.prods.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td></tr>`).join('')}</table></div></div></div><div class="card"><h3>Riwayat transaksi</h3>${S.map(s=>`<div class="it"><div onclick="receipt(${s.id})" style="cursor:pointer">${s.no}<br><small>${fd(s.t)} · ${esc(s.cashier)}</small></div><b>${rp(s.total)}</b>${can('void')?`<button class="r s" onclick="vd(${s.id})">Batal</button>`:''}</div>`).join('')||'<p class="m">Tidak ada.</p>'}</div>`};
function vd(id){const s=db.sales.find(x=>x.id==id);if(!confirm('Batalkan transaksi '+s.no+'? Stok dikembalikan.'))return;s.void=1;s.items.forEach(i=>{const p=find(i.id);if(p){p.stock+=i.qty;db.slog.unshift({t:Date.now(),pid:p.id,q:i.qty,type:'Batal',note:s.no})}});lg('Batal '+s.no);save();V.laporan()}

/* PENGATURAN */
V.atur=()=>{const s=db.set;$('v').innerHTML=`<div class="card"><h3>Identitas & tampilan</h3><div class="row"><button onclick="sid()">Ubah identitas warung</button><button class="g" onclick="fm('Logo',[{k:'i',l:'Pilih logo',t:'file'}],r=>{if(r.i){db.set.logo=r.i;save();shell()}})">Logo</button><button class="g" onclick="fm('QRIS',[{k:'i',l:'Gambar QRIS warung',t:'file',max:600}],r=>{if(r.i){db.set.qris=r.i;save();alert('QRIS disimpan')}})">Gambar QRIS</button><button class="g" onclick="fm('Tampilan',[{k:'color',l:'Warna',t:'color',v:db.set.color},{k:'theme',l:'Tema',t:'sel',o:[['auto','Otomatis'],['light','Terang'],['dark','Gelap']],v:db.set.theme}],r=>{Object.assign(db.set,r);save();shell()})">Warna & tema</button></div></div>
<div class="card"><h3>Struk</h3><div class="row"><button class="g" onclick="fm('Struk',[{k:'paper',l:'Ukuran kertas',t:'sel',o:[['58','58 mm'],['80','80 mm'],['A4','A4']],v:db.set.paper},{k:'footer',l:'Pesan penutup',v:db.set.footer}],r=>{Object.assign(db.set,r);save();V.atur()})">Ukuran: ${s.paper} · ubah</button></div></div>
<div class="card"><h3>Kategori</h3>${db.cats.map((c,i)=>`<div class="it"><div>${esc(c)}</div><button class="g s" onclick="fm('Nama kategori',[{k:'n',l:'Nama',v:db.cats[${i}]}],r=>{if(!r.n)return false;db.prods.forEach(p=>{if(p.cat==db.cats[${i}])p.cat=r.n});db.cats[${i}]=r.n;save();V.atur()})">✎</button><button class="r s" onclick="if(confirm('Hapus kategori?')){db.cats.splice(${i},1);save();V.atur()}">✕</button></div>`).join('')}<button onclick="fm('Kategori baru',[{k:'n',l:'Nama'}],r=>{if(r.n){db.cats.push(r.n);save();V.atur()}})" style="margin-top:8px">+ Kategori</button></div>
<div class="card"><h3>Pengguna</h3>${db.users.map(u=>`<div class="it"><div>${esc(u.name)} <small>(${u.role})</small></div><button class="g s" onclick="uf(${u.id})">Ubah / ganti PIN</button><button class="g s" onclick="pm(${u.id})">Izin</button>${u.id!=me.id?`<button class="r s" onclick="if(confirm('Hapus pengguna?')){db.users=db.users.filter(x=>x.id!=${u.id});save();V.atur()}">✕</button>`:''}</div>`).join('')}<button onclick="uf()" style="margin-top:8px">+ Pengguna</button><p class="m" style="font-size:12px">Pemilik: semua akses. Untuk tiap pengguna lain, tombol Izin mengatur menu dan fitur (ubah harga, diskon, batalkan transaksi) yang boleh dipakai.</p></div>
<div class="card"><h3>Backup data</h3><div class="row"><button onclick="dl('backup-kasir-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db),'application/json')">Backup (unduh)</button><button class="g" onclick="rs()">Restore</button><button class="r" onclick="if(confirm('HAPUS SEMUA DATA?')&&prompt('Ketik HAPUS')=='HAPUS'){db=D0();save();location.reload()}">Reset</button></div><p class="m" style="font-size:12px">Data tersimpan di browser perangkat ini. Backup rutin, dan pindahkan ke perangkat lain lewat Restore.</p></div>
<div class="card"><h3>Riwayat aktivitas</h3>${db.log.slice(0,30).map(l=>`<div class="it"><div>${esc(l.a)}<br><small>${fd(l.t)} · ${esc(l.u)}</small></div></div>`).join('')}</div>`};
function sid(){const s=db.set;fm('Identitas warung',[{k:'name',l:'Nama usaha',v:s.name},{k:'owner',l:'Nama pemilik',v:s.owner},{k:'addr',l:'Alamat',v:s.addr},{k:'wa',l:'Nomor WhatsApp',v:s.wa}],r=>{Object.assign(db.set,r);save();shell()})}
function uf(id){const u=db.users.find(x=>x.id==id)||{};fm('Pengguna',[{k:'name',l:'Nama',v:u.name},{k:'role',l:'Peran',t:'sel',o:['owner','kasir'],v:u.role||'kasir'},{k:'pin',l:'PIN / password',v:u.pin}],r=>{if(!r.name||!r.pin)return false;if(u.id){if(u.id==me.id&&r.role!='owner'){alert('Tidak bisa menurunkan peran sendiri');return false}Object.assign(u,r)}else db.users.push({id:uid(),...r});lg('Ubah pengguna '+r.name);save();V.atur()})}
function rs(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.prods||!d.users)throw 0;if(!confirm('Timpa semua data dengan backup ini?'))return;db=d;save();alert('Restore berhasil. Silakan masuk lagi.');me=null;login()}catch(e){alert('File backup tidak valid')}};i.click()}
