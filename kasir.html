const SC=new Map(),ld=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
function sigImg(im){const w=im.naturalWidth||im.videoWidth,h=im.naturalHeight||im.videoHeight,z=Math.min(w,h)*.8,sx=(w-z)/2,sy=(h-z)/2;
const px=(c)=>{const k=document.createElement('canvas');k.width=k.height=24;const x=k.getContext('2d',{willReadFrequently:true});c?x.drawImage(im,sx,sy,z,z,0,0,24,24):x.drawImage(im,0,0,w,h,0,0,24,24);return x.getImageData(0,0,24,24).data};

for(let i=0;i<24;i++)for(const[x,y]of[[i,0],[i,23],[0,i],[23,i]]){const o=(y*24+x)*4;for(let k=0;k<3;k++)R[k].push(F[o+k])}
const bg=R.map(a=>a.sort((p,q)=>p-q)[a.length>>1]);let m=0;for(let i=0;i<C.length;i+=4)m+=(C[i]+C[i+1]+C[i+2])/3;m/=576;const k=Math.min(1.8,Math.max(.6,128/(m||1)));
const P=[];for(let i=0;i<C.length;i+=4)P.push([C[i],C[i+1],C[i+2],Math.hypot(C[i]-bg[0],C[i+1]-bg[1],C[i+2]-bg[2])>55]);
const use=P.filter(p=>p[3]).length>=46,hh=new Array(64).fill(0);let n=0;

<script>
/* ===== SINKRON ONLINE (Supabase) ===== */
(()=>{
const DEF={url:'',key:''}; // opsional: isi URL & key Supabase di sini agar terisi otomatis di semua HP
const ARR=['users','prods','sales','custs','pays','exps','slog','closes'],ONE=['set','cats'],SORT=['sales','slog','exps','pays','closes'];
const CFG='sync_cfg',SNAP='sync_snap',QUE='sync_q',CUR='sync_cur',enc=encodeURIComponent;
const get=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const rnd=()=>Math.random().toString(36).slice(2,10);
const hsh=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const keyOf=it=>{if(it.id!=null)return'i'+it.id;if(!it._k)it._k=Date.now().toString(36)+rnd();return'k'+it._k};
const rd3=n=>Math.round(n*1000)/1000;
let SC=get(CFG,null),SQ=get(QUE,[]),SN=null,busy=false,again=false,timer=null,stat=SC?'menunggu…':'',DIRTY=true;
function setStat(t){stat=t;document.querySelectorAll('#sd,#syst').forEach(e=>e.textContent=t)}
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};

async function rq(m,p,body,h){
  const hd={apikey:SC.key,'x-store-key':SC.store,'Content-Type':'application/json',...(h||{})};
  if(/^eyJ/.test(SC.key))hd.Authorization='Bearer '+SC.key;
  const r=await fetch(SC.url.replace(/\/+$/,'')+'/rest/v1/'+p,{method:m,headers:hd,body:body?JSON.stringify(body):undefined});
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error('HTTP '+r.status+' '+t.slice(0,140))}
  return m=='GET'?r.json():null;
}

// Bandingkan data sekarang dengan keadaan terakhir yang sudah tersinkron -> daftar perubahan
function mkOps(base){
  const old=base?{c:{},o:{}}:(SN||get(SNAP,{c:{},o:{}})),ns={c:{},o:{}},ops=[];
  const mk=(c,k,op,data,ds)=>{const o={oid:SC.dev+'-'+Date.now().toString(36)+rnd(),coll:c,k,op,ts:Date.now()};if(data!==undefined)o.data=data;if(ds)o.ds=ds;ops.push(o)};
  for(const c of ARR){
    const o0=old.c[c]||{},nw={};
    for(const it of(db[c]||[])){
      const k=keyOf(it),h=hsh(JSON.stringify(it)),o=o0[k];
      nw[k]={h,s:c=='prods'?(+it.stock||0):0};
      if(!o)mk(c,k,'set',it);
      else if(o.h!=h)mk(c,k,'set',it,c=='prods'?rd3((+it.stock||0)-o.s):0);
    }
    for(const k in o0)if(!(k in nw))mk(c,k,'del');
    ns.c[c]=nw;
  }
  for(const c of ONE){const h=hsh(JSON.stringify(db[c]));ns.o[c]=h;if(old.o[c]!=h)mk(c,c,'set',db[c])}
  SN=ns;
  if(base)return;
  if(ops.length){SQ=SQ.concat(ops);if(put(QUE,SQ))put(SNAP,SN)}else put(SNAP,SN);
}

async function push(){
  while(SQ.length){
    let n=0,sz=0;while(n<SQ.length&&n<60&&(n==0||sz<500000)){sz+=JSON.stringify(SQ[n]).length;n++}
    const b=SQ.slice(0,n);
    await rq('POST','ops?on_conflict=store,oid',b.map(o=>({store:SC.store,dev:SC.dev,oid:o.oid,coll:o.coll,k:o.k,op:o.op,data:o.data===undefined?null:o.data,ds:o.ds===undefined?null:o.ds,ts:o.ts})),{Prefer:'resolution=ignore-duplicates,return=minimal'});
    SQ=SQ.slice(n);put(QUE,SQ);setStat('⟳ mengirim… sisa '+SQ.length);
  }
  put(QUE,[]);put(SNAP,SN);
}

// Terapkan satu perubahan dari HP lain
function apply(o){
  const c=o.coll;
  if(ONE.includes(c)){if(o.op=='set'&&o.data!=null){db[c]=o.data;SN.o[c]=hsh(JSON.stringify(o.data))}return}
  if(!ARR.includes(c))return;
  const arr=db[c]=db[c]||[],sn=SN.c[c]=SN.c[c]||{},idx=arr.findIndex(x=>keyOf(x)==o.k),cur=idx>=0?arr[idx]:null;
  if(o.op=='del'){if(idx>=0)arr.splice(idx,1);delete sn[o.k];return}
  if(o.data==null)return;
  const dirty=cur&&sn[o.k]&&hsh(JSON.stringify(cur))!=sn[o.k].h;   // ada perubahan lokal yang belum terkirim
  if(c=='prods'&&cur&&dirty){if(o.ds){cur.stock=rd3((+cur.stock||0)+o.ds);sn[o.k].s=rd3(sn[o.k].s+o.ds)}return}
  if(cur&&dirty)return;
  let it=o.data;
  if(c=='prods'&&cur)it={...it,stock:o.ds!=null?rd3((+cur.stock||0)+o.ds):cur.stock};
  if(cur)arr[idx]=it;else arr.push(it);
  sn[o.k]={h:hsh(JSON.stringify(it)),s:c=='prods'?(+it.stock||0):0};
}

async function pull(){
  let cur=get(CUR,0),total=0;
  for(;;){
    const rows=await rq('GET','ops?store=eq.'+enc(SC.store)+'&seq=gt.'+cur+'&order=seq.asc&limit=300&select=seq,dev,coll,k,op,data,ds');
    let ch=0;
    for(const o of rows){if(o.dev!=SC.dev){apply(o);ch++}cur=o.seq}
    if(ch){for(const c of SORT)if(db[c])db[c].sort((a,b)=>(b.t||0)-(a.t||0));persist()}
    put(SNAP,SN);put(CUR,cur);total+=ch;
    if(rows.length<300)break;
    setStat('⟳ mengambil data…');
  }
  return total;
}

function afterPull(){
  if(me){const u=db.users.find(x=>x.id==me.id&&x.role!='owner');if(u)me=u;else{me=null;cart=[];cl();login();return}}
  try{theme()}catch(e){}
  const m=$('m');if(m&&m.style.display=='flex')return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(!me){if(window.login)login();return}
  if(view=='kasir'){if($('q')&&window.res)res()}else if(V[view])V[view]();
}

async function sync(){
  if(!SC)return;
  if(busy){again=true;return}
  busy=true;setStat('⟳ sinkron…');
  try{
    if(!SN)SN=get(SNAP,{c:{},o:{}});
    if(DIRTY){DIRTY=false;mkOps()}
    await push();
    const n=await pull();
    setStat('☁ tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
    if(n)afterPull();
  }catch(e){
    setStat(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'⚠ offline atau alamat salah. Data aman di HP.':'⚠ '+e.message.slice(0,90));
  }
  busy=false;
  if(again||DIRTY){again=false;clearTimeout(timer);timer=setTimeout(sync,400)}
}
window.syNow=()=>sync();
window.syDirty=()=>{DIRTY=true;if(SC){clearTimeout(timer);timer=setTimeout(sync,1200)}};

// ===== Menu di Pengaturan =====
const genStore=()=>{const a=new Uint8Array(20);crypto.getRandomValues(a);return[...a].map(x=>(x%36).toString(36)).join('')};
const code=()=>btoa(unescape(encodeURIComponent(JSON.stringify({u:SC.url,k:SC.key,s:SC.store}))));
function ui(){
  const q=SQ.length;
  return'<div class="card"><h3>☁ Sinkronisasi online</h3>'+(SC?
   '<p class="m">Terhubung ke Supabase. Stok, produk, dan transaksi dari semua HP otomatis sama.<br><b id="syst">'+esc(stat)+'</b>'+(q?' · '+q+' perubahan menunggu dikirim':'')+'</p><div class="row"><button onclick="syNow()">Sinkron sekarang</button><button class="g" onclick="syShare()">Salin kode sambung</button><button class="g" onclick="syOff()">Putuskan</button></div>':
   '<p class="m">Hubungkan agar produk, stok, dan transaksi dari semua HP tergabung. Perlu internet. Tanpa internet aplikasi tetap jalan, dan data dikirim saat online kembali.</p><div class="row"><button onclick="syFirst()">Hubungkan (HP pertama)</button><button class="g" onclick="syJoinUi()">Gabung dari HP lain</button></div>')+'</div>';
}
window.syFirst=()=>modal('<h3>Hubungkan HP pertama</h3><p class="m">Data di HP ini akan diunggah ke Supabase. HP lain nanti bergabung dengan kode sambung.</p><label>Project URL<input id="sy_u" value="'+esc(DEF.url)+'" placeholder="https://xxxx.supabase.co"></label><label>Anon / publishable key<input id="sy_k" value="'+esc(DEF.key)+'"></label><label>Kode toko (rahasia, jangan dibagikan sembarangan)<input id="sy_s" value="'+genStore()+'"></label><div class="row"><button class="g" onclick="cl()">Batal</button><button onclick="syFirstGo()">Hubungkan</button></div>');
window.syFirstGo=async()=>{
  const url=$('sy_u').value.trim(),key=$('sy_k').value.trim(),store=$('sy_s').value.trim();
  if(!/^https:\/\//.test(url))return alert('Project URL harus diawali https://');
  if(key.length<20)return alert('Isi anon / publishable key dari Supabase.');
  if(store.length<16)return alert('Kode toko minimal 16 karakter.');
  SC={url,key,store,dev:rnd()+rnd()};
  try{const r=await rq('GET','ops?store=eq.'+enc(store)+'&select=seq&limit=1');if(r.length){SC=null;return alert('Kode toko ini sudah berisi data. Pakai "Gabung dari HP lain", atau buat kode toko baru.')}}
  catch(e){SC=null;return alert('Gagal terhubung: '+e.message+'\n\nPeriksa internet, URL, key, dan bahwa SQL setup sudah dijalankan di Supabase.')}
  put(CFG,SC);put(SNAP,{c:{},o:{}});put(CUR,0);SQ=[];put(QUE,SQ);SN={c:{},o:{}};DIRTY=true;cl();
  await sync();
  if(view=='atur')V.atur();
  if(/^☁/.test(stat)){alert('Terhubung dan data sudah diunggah. Sekarang salin kode sambung untuk HP lain.');syShare()}else alert('Tersambung, tetapi belum selesai mengirim: '+stat);
};
window.syShare=()=>{const c=code();if(navigator.clipboard)navigator.clipboard.writeText(c).then(()=>alert('Kode sambung disalin. Kirim lewat WhatsApp ke HP lain. Jangan dibagikan ke orang luar.'),()=>prompt('Salin kode ini:',c));else prompt('Salin kode ini:',c)};
window.syJoinUi=()=>modal('<h3>Gabung dari HP lain</h3><p class="m">Tempel kode sambung dari HP pertama. <b>Data di HP ini akan diganti</b> dengan data toko dari server.</p><label>Kode sambung<input id="sy_c" autocomplete="off"></label><div class="row"><button class="g" onclick="cl()">Batal</button><button onclick="syJoinGo()">Gabung</button></div>');
window.syJoinGo=async()=>{
  let c;try{c=JSON.parse(decodeURIComponent(escape(atob($('sy_c').value.trim()))))}catch(e){return alert('Kode sambung tidak valid.')}
  if(!c||!c.u||!c.k||!c.s)return alert('Kode sambung tidak valid.');
  SC={url:c.u,key:c.k,store:c.s,dev:rnd()+rnd()};
  try{const r=await rq('GET','ops?store=eq.'+enc(c.s)+'&select=seq&limit=1');if(!r.length){SC=null;return alert('Belum ada data untuk kode ini. Pastikan HP pertama sudah selesai sinkron.')}}
  catch(e){SC=null;return alert('Gagal terhubung: '+e.message)}
  if(!confirm('Data di HP ini akan DIGANTI dengan data dari server. Lanjutkan?')){SC=null;return}
  let bak='';try{bak=localStorage.getItem(K)||'';localStorage.setItem('kasir_warung_db_prejoin',bak)}catch(e){}
  db=D0();db.users=[];put(CFG,SC);put(CUR,0);SQ=[];put(QUE,SQ);mkOps(true);put(SNAP,SN);DIRTY=false;cl();
  await sync();
  if(!db.users.length){
    db=bak?JSON.parse(bak):D0();persist();SC=null;SN=null;[CFG,SNAP,QUE,CUR].forEach(k=>localStorage.removeItem(k));
    alert('Gagal mengambil data ('+stat+'). Data HP ini dikembalikan seperti semula.');me=null;login();return;
  }
  persist();me=null;cart=[];login();alert('Berhasil bergabung. Silakan masuk.');
};
window.syOff=()=>{if(!confirm((SQ.length?'PERINGATAN: '+SQ.length+' perubahan belum terkirim ke HP lain. Sebaiknya Batal, lalu sinkronkan dulu.\n\n':'')+'Putuskan sinkronisasi? Data di HP ini tetap ada, tetapi tidak lagi dibagi ke HP lain. Kalau nanti memakai Gabung dari HP lain, data di HP ini diganti dengan data server.'))return;SC=null;SN=null;SQ=[];[CFG,SNAP,QUE,CUR].forEach(k=>localStorage.removeItem(k));setStat('');if(view=='atur')V.atur()};

// Pasang ke tampilan yang sudah ada
const _atur=V.atur;V.atur=()=>{_atur();$('v').insertAdjacentHTML('beforeend',ui())};
const _shell=shell;shell=function(){_shell();const s=document.querySelector('header .hd small');if(s&&SC)s.insertAdjacentHTML('beforeend',' · <span id="sd">'+esc(stat)+'</span>')};
setInterval(()=>{if(SC&&!document.hidden&&navigator.onLine!==false)sync()},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SC)setTimeout(sync,300)});
addEventListener('online',()=>{if(SC)setTimeout(sync,300)});
if(SC)setTimeout(sync,1500);
window.__sy={sync,get SC(){return SC},get SQ(){return SQ}};
})();
</script>
